<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>שם לפי שעה</title>

<style>
body {
    margin: 0;
    font-family: 'Frank Ruhl Libre', serif;
    color: white;
    text-align: center;

    background: url("background.jpeg") no-repeat center center fixed;
    background-size: cover;
}

/* Overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
}

/* Wrapper */
#content {
    position: relative;
    z-index: 1;
}

/* Title */
#title {
    font-size: 5vw;
    margin-top: 20px;
    text-shadow: 0 0 10px gold;
}

/* Clock */
#clock {
    font-size: 4vw;
    margin-top: 5px;
}

/* Main Name */
#name {
    font-size: 9vw;
    margin-top: 18vh;
    font-weight: bold;

    text-shadow:
        0 0 10px #fff,
        0 0 20px gold,
        0 0 40px gold;

    transition: opacity 0.5s ease;
    animation: glowPulse 3s infinite alternate;
}

/* Glow animation */
@keyframes glowPulse {
    from {
        text-shadow:
            0 0 10px #fff,
            0 0 20px gold,
            0 0 30px gold;
    }
    to {
        text-shadow:
            0 0 20px #fff,
            0 0 40px gold,
            0 0 60px gold;
    }
}

/* Time Range */
#timeRange {
    margin-top: 15px;
    font-size: 3vw;
    direction: ltr;
}
</style>
</head>

<body>

<div id="content">

<div id="title">שם לפי שעה</div>
<div id="clock"></div>

<div id="name"></div>

<div id="timeRange"></div>

</div>

<script>
const nightNames = [
"אדני אינד","אדינ אידנ","אניד אנדי","דניא ינדא",
"דנאי ינאד","דינא ידנא","נדאי ניאד","נדיא נידא",
"נאדי נאיד","דאינ יאדנ","דאני יאנד","דיאנ ידאנ"
];

const dayNames = [
"יהוה אהיה","יההו אההי","יוהה איהה","הוהי היהא",
"הויה היאה","ההוי ההיא","והיה יהאה","וההי יההא",
"ויהה יאהה","היהו האהי","היוה האיה","ההיו ההאי"
];

/* Format full time */
function formatTime(hour, min, sec) {
    let h = hour % 12;
    if (h === 0) h = 12;
    let ampm = hour < 12 ? "AM" : "PM";
    return `${h}:${min}:${sec} ${ampm}`;
}

/* Format hour */
function formatHour(hour) {
    let h = hour % 12;
    if (h === 0) h = 12;
    return h + (hour < 12 ? " AM" : " PM");
}

/* Get correct name */
function getName(hour) {
    if (hour >= 18 || hour < 6) {
        let index = (hour >= 18) ? hour - 18 : hour + 6;
        return nightNames[index % 12];
    } else {
        let index = hour - 6;
        return dayNames[index % 12];
    }
}

/* Update everything */
function updateClock() {
    const now = new Date();

    let h = now.getHours();
    let m = String(now.getMinutes()).padStart(2, '0');
    let s = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("clock").innerText =
        formatTime(h, m, s);

    // Smooth name transition
    const nameEl = document.getElementById("name");
    nameEl.style.opacity = 0;

    setTimeout(() => {
        nameEl.innerText = getName(h);
        nameEl.style.opacity = 1;
    }, 200);

    let next = (h + 1) % 24;
    document.getElementById("timeRange").innerText =
        formatHour(h) + " - " + formatHour(next);
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
