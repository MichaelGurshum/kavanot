<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שם לפי שעה</title>

<!-- Scripture-like font -->
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Frank Ruhl Libre', serif;
  overflow: hidden;
  text-align: center;
  color: white;
  position: relative;
}

/* Background image container */
#background {
  position: fixed;
  top:0; left:0;
  width: 100%;
  height: 100%;
  background: url("background.jpeg") center/cover no-repeat;
  z-index: 0;
}

/* Dark overlay behind content, but above background */
#overlay {
  position: fixed;
  top:0; left:0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.7); /* 70% black */
  z-index: 1;
}

/* Content container above overlay */
#content {
  position: relative;
  z-index: 2;
}

/* ---------- NAME ---------- */
#message {
  font-size: 12vw;
  font-weight: 900;
  letter-spacing: 18px;
  margin-top: 15vh;
  color: #fff9b0;
  text-align: center;
  text-shadow:
    0 0 10px #fff9b0,
    0 0 20px #fff38a,
    0 0 40px #ffe45c,
    0 0 80px #ffd83b,
    0 0 120px #ffc800,
    0 0 160px #ffc800,
    0 0 200px #ffc800;
  filter: drop-shadow(0 0 30px #ffd83b);
  animation: holyGlow 3s ease-in-out infinite alternate;
  transition: opacity .4s;
}
@keyframes holyGlow {
  0% { text-shadow: 0 0 10px #fff9b0,0 0 20px #fff38a,0 0 40px #ffe45c,0 0 80px #ffd83b,0 0 120px #ffc800,0 0 160px #ffc800,0 0 200px #ffc800;}
  100% { text-shadow: 0 0 20px #fff9b0,0 0 40px #fff38a,0 0 80px #ffe45c,0 0 140px #ffd83b,0 0 200px #ffc800,0 0 240px #ffc800,0 0 280px #ffc800;}
}

/* ---------- CLOCK ---------- */
#clockContainer {
  position: absolute;
  bottom: 20px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Digital clock */
#digitalClock {
  font-size: 28px;
  text-shadow: 0 0 10px white, 0 0 20px #ffe680;
}

/* Example button */
button {
  font-size: 16px;
  padding: 8px 16px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  background-color: rgba(255,255,255,0.2);
  color: #fff;
  text-shadow: 0 0 6px #fff;
  cursor: pointer;
}
button:hover {
  background-color: rgba(255,255,255,0.4);
}
</style>
</head>
<body>

<div id="background"></div>
<div id="overlay"></div>

<div id="content">
  <div id="message"></div>

  <div id="clockContainer">
    <!-- analog clock commented out -->
    <!-- <div class="clock"> ... </div> -->
    <div id="digitalClock"></div>
  </div>

  <audio id="chime" src="chime.mp3" preload="auto"></audio>
</div>

<script>
const nightNames=["אדני","אדינ","אניד","דניא","דנאי","דינא","נדאי","נדיא","נאדי","דאינ","דאני","דיאנ"];
const dayNames=["יהוה","יההו","יוהה","הוהי","הויה","ההוי","והיה","וההי","ויהה","היהו","היוה","ההיו"];
let lastHour=-1;

function getName(hour){
  if(hour>=18) return nightNames[hour-18];
  if(hour<6) return nightNames[hour+6];
  return dayNames[hour-6];
}

function updateName(){
  let hour=new Date().getHours();
  if(hour!==lastHour){
    lastHour=hour;
    let name=getName(hour);
    let message=document.getElementById("message");
    message.style.opacity=0;
    setTimeout(()=>{
      message.innerText=name;
      message.style.opacity=1;
    },300);
    document.getElementById("chime").play().catch(()=>{});
  }
}

function updateClock(){
  const now=new Date();
  document.getElementById("digitalClock").textContent = now.toLocaleTimeString();
}

function tick(){
  updateClock();
  updateName();
}

setInterval(tick,1000);
tick();
</script>

</body>
</html>
