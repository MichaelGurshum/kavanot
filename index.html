<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שם לפי שעה</title>
<style>
body {
    margin: 0;
    font-family: 'Frank Ruhl Libre', serif;
    text-align: center;
    background: url("background.jpeg") no-repeat center center fixed;
    background-size: cover;
    color: white;
}

/* Dark overlay so name and clock pop */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
}

#content {
    position: relative;
    z-index: 1;
}

#title {
    font-size: 5vw;
    margin-top: 20px;
    text-shadow: 0 0 10px gold;
}

/* Clock will match name size dynamically */
#clock {
    margin-top: 5px;
}

/* Main name container */
#name {
    font-size: 9vw;
    margin-top: 18vh;
    font-weight: bold;
    white-space: nowrap;
    direction: rtl;
}

/* Fire + glow + outer glow for Display2Go */
.fire-layer {
    display: inline-block;
    position: relative;
    margin: 0 1px;
}

.fire-layer .base {
    color: yellow;
    font-weight: bold;
    text-shadow:
        0 0 5px #fff,
        0 0 10px yellow,
        0 0 15px orange,
        0 0 25px gold,
        0 0 30px orange; /* outer glow */
}

.fire-layer .glow {
    position: absolute;
    top: 0; left: 0;
    color: orange;
    opacity: 0.5;
    animation: glowFlicker 0.6s infinite;
}

.fire-layer .spark {
    position: absolute;
    top: 0; left: 0;
    color: red;
    opacity: 0.3;
    animation: glowFlickerAlt 0.7s infinite alternate;
}

@keyframes glowFlicker {
  0% { opacity: 0.3; }
  50% { opacity: 0.8; }
  100% { opacity: 0.3; }
}

@keyframes glowFlickerAlt {
  0% { opacity: 0.2; }
  50% { opacity: 0.6; }
  100% { opacity: 0.2; }
}

#timeRange {
    margin-top: 10px;
    font-size: 3vw;
    direction: ltr;
}

#bottomStrip {
    position: fixed;
    bottom: 0;
    width: 100%;
    overflow-x: auto;
    white-space: nowrap;
    background: rgba(0,0,0,0.5);
    padding: 6px 0;
}

.hourItem {
    display: inline-block;
    margin: 0 8px;
    font-size: 2.8vw;
    opacity: 0.7;
}

.active {
    color: gold;
    font-weight: bold;
    opacity: 1;
    text-shadow: 0 0 10px gold;
}
</style>
</head>
<body>
<div id="content">
    <div id="title">שם לפי שעה</div>
    <div id="clock"></div>
    <div id="name"></div>
    <div id="timeRange"></div>
</div>
<div id="bottomStrip"></div>

<script>
// 24-hour exact mapping for main display names
const hourNames = [
  "נדאי ניאד", // 0
  "נדיא נידא", // 1
  "נאדי נאיד", // 2
  "דאינ יאדנ", // 3
  "דאני יאנד", // 4
  "דיאנ ידאנ", // 5
  "יהוה אהיה", // 6 AM
  "יההו אההי", // 7
  "יוהה איהה", // 8
  "הוהי היהא", // 9
  "הויה היאה", // 10
  "ההוי ההיא", // 11
  "והיה יהאה", // 12 PM
  "וההי יההא", // 13
  "ויהה יאהה", // 14
  "היהו האהי", // 15
  "היוה האיה", // 16
  "ההיו ההאי", // 17
  "אדני אינד", // 18 → 6 PM
  "אדינ אידנ", // 19
  "אניד אנדי", // 20
  "דניא ינדא", // 21
  "דנאי ינאד", // 22
  "דינא ידנא"  // 23
];

/* Add dashes between letters within each word */
function addDashes(name) {
    return name.split(" ").map(word => word.split("").join("-")).join(" ");
}

/* Create fire + glow layers */
function addFireGlow(name){
    return name.split(" ").map(word=>{
        return word.split("").map((letter,i)=>{
            let dash = (i<word.length-1) ? "-" : "";
            return `<span class="fire-layer">
                        <span class="base">${letter}</span>
                        <span class="glow">${letter}</span>
                        <span class="spark">${letter}</span>
                    </span>${dash}`;
        }).join("");
    }).join(" ");
}

function formatTime(hour, min, sec) {
    let h = hour % 12; if(h==0) h=12;
    let ampm = hour<12 ? "AM":"PM";
    return `${h}:${min}:${sec} ${ampm}`;
}

function formatHour(hour){
    let h = hour % 12; if(h==0) h=12;
    return h + (hour<12 ? " AM":" PM");
}

function getName(hour){
    return hourNames[hour]; // direct mapping
}

function buildStrip(currentHour){
    let html="";
    for(let i=0;i<24;i++){
        let cls=(i===currentHour)?"hourItem active":"hourItem";
        html+=`<span class="${cls}">${formatHour(i)} ${addDashes(getName(i))}</span>`;
    }
    document.getElementById("bottomStrip").innerHTML=html;
}

function updateClock(){
    const now=new Date();
    let h=now.getHours(), m=String(now.getMinutes()).padStart(2,'0'), s=String(now.getSeconds()).padStart(2,'0');

    const nameEl=document.getElementById("name");
    const clockEl=document.getElementById("clock");

    // Clock font-size = main name font-size
    const nameSize = window.getComputedStyle(nameEl).fontSize;
    clockEl.style.fontSize = nameSize;

    clockEl.innerText=formatTime(h,m,s);

    nameEl.style.opacity=0;
    setTimeout(()=>{
        nameEl.innerHTML=addFireGlow(getName(h));
        nameEl.style.opacity=1;
    },200);

    let next=(h+1)%24;
    document.getElementById("timeRange").innerText=formatHour(h)+" - "+formatHour(next);

    buildStrip(h);
}

setInterval(updateClock,1000);
updateClock();
</script>
</body>
</html>
