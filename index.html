<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>שם לפי שעה</title>

<style>
body {
    margin: 0;
    font-family: 'Frank Ruhl Libre', serif;
    color: white;
    text-align: center;
    background: url("background.jpeg") no-repeat center center fixed;
    background-size: cover;
}

/* Overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
}

/* Wrapper */
#content {
    position: relative;
    z-index: 1;
}

/* Title */
#title {
    font-size: 5vw;
    margin-top: 20px;
    text-shadow: 0 0 10px gold;
}

/* Clock */
#clock {
    font-size: 4vw;
    margin-top: 5px;
}

/* Main Name Fire + Glow Effect */
#name {
    font-size: 9vw;
    margin-top: 18vh;
    font-weight: bold;
    transition: opacity 0.5s ease;
}

/* Each letter span */
#name span {
    display: inline-block;
    color: yellow;
    text-shadow: 0 0 5px #fff, 0 0 10px orange, 0 0 15px red, 0 0 25px gold;
    animation: fireGlow 0.7s infinite;
}

@keyframes fireGlow {
    0% {
        text-shadow: 0 0 5px #fff, 0 0 10px orange, 0 0 15px red, 0 0 25px gold;
        transform: translateY(0);
    }
    50% {
        text-shadow: 0 0 10px #fff, 0 0 15px orange, 0 0 20px red, 0 0 35px gold;
        transform: translateY(-2px);
    }
    100% {
        text-shadow: 0 0 5px #fff, 0 0 10px orange, 0 0 15px red, 0 0 25px gold;
        transform: translateY(0);
    }
}

/* Time range */
#timeRange {
    margin-top: 10px;
    font-size: 3vw;
    direction: ltr;
}

/* Bottom strip */
#bottomStrip {
    position: fixed;
    bottom: 0;
    width: 100%;
    overflow-x: auto;
    white-space: nowrap;
    background: rgba(0,0,0,0.5);
    padding: 6px 0;
}

/* Items */
.hourItem {
    display: inline-block;
    margin: 0 8px;
    font-size: 2.8vw;
    opacity: 0.7;
}

/* Active hour highlight */
.active {
    color: gold;
    font-weight: bold;
    opacity: 1;
    text-shadow: 0 0 10px gold;
}
</style>
</head>

<body>

<div id="content">

<div id="title">שם לפי שעה</div>
<div id="clock"></div>

<div id="name"></div>

<div id="timeRange"></div>

</div>

<div id="bottomStrip"></div>

<script>
const nightNames = [
"אדני אינד","אדינ אידנ","אניד אנדי","דניא ינדא",
"דנאי ינאד","דינא ידנא","נדאי ניאד","נדיא נידא",
"נאדי נאיד","דאינ יאדנ","דאני יאנד","דיאנ ידאנ"
];

const dayNames = [
"יהוה אהיה","יההו אההי","יוהה איהה","הוהי היהא",
"הויה היאה","ההוי ההיא","והיה יהאה","וההי יההא",
"ויהה יאהה","היהו האהי","היוה האיה","ההיו ההאי"
];

/* Add dashes between letters */
function addDashes(name) {
    return name
        .split(" ")
        .map(word => word.split("").join("-"))
        .join(" ");
}

/* Wrap letters in spans for fire + glow */
function addFireGlow(name) {
    return name.split(" ").map(word =>
        word.split("").map(letter =>
            `<span>${letter}</span>`
        ).join("-")
    ).join(" ");
}

function formatTime(hour, min, sec) {
    let h = hour % 12;
    if (h === 0) h = 12;
    let ampm = hour < 12 ? "AM" : "PM";
    return `${h}:${min}:${sec} ${ampm}`;
}

function formatHour(hour) {
    let h = hour % 12;
    if (h === 0) h = 12;
    return h + (hour < 12 ? " AM" : " PM");
}

function getName(hour) {
    if (hour >= 18 || hour < 6) {
        let index = (hour >= 18) ? hour - 18 : hour + 6;
        return nightNames[index % 12];
    } else {
        let index = hour - 6;
        return dayNames[index % 12];
    }
}

/* Bottom strip */
function buildStrip(currentHour) {
    let html = "";
    for (let i = 0; i < 24; i++) {
        let cls = (i === currentHour) ? "hourItem active" : "hourItem";
        html += `<span class="${cls}">
            ${formatHour(i)} ${addDashes(getName(i))}
        </span>`;
    }
    document.getElementById("bottomStrip").innerHTML = html;
}

/* Update UI */
function updateClock() {
    const now = new Date();
    let h = now.getHours();
    let m = String(now.getMinutes()).padStart(2, '0');
    let s = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("clock").innerText = formatTime(h, m, s);

    const nameEl = document.getElementById("name");
    nameEl.style.opacity = 0;

    setTimeout(() => {
        nameEl.innerHTML = addFireGlow(getName(h));
        nameEl.style.opacity = 1;
    }, 200);

    let next = (h + 1) % 24;
    document.getElementById("timeRange").innerText =
        formatHour(h) + " - " + formatHour(next);

    buildStrip(h);
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
