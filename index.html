<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>שם לפי שעה</title>

<style>
body {
    margin: 0;
    font-family: 'Frank Ruhl Libre', serif;
    color: white;
    text-align: center;
    overflow: hidden;
}

/* Background */
#bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("background.jpeg") center center / cover no-repeat;
    z-index: -2;
}

/* Dark overlay */
#overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
}

/* Title */
#title {
    font-size: 5vw;
    margin-top: 15px;
    text-shadow: 0 0 10px gold, 0 0 20px gold;
}

/* Clock */
#clock {
    font-size: 4vw;
    margin-top: 5px;
}

/* Names container */
#names {
    margin-top: 8vh;
}

/* BOTH NAMES SAME SIZE */
.name {
    font-size: 9vw;
    font-weight: bold;
    margin: 10px 0;
    text-shadow:
        0 0 10px #fff,
        0 0 20px gold,
        0 0 40px gold;
}

/* Time range */
#timeRange {
    margin-top: 15px;
    font-size: 3vw;
    direction: ltr;
}

/* Table */
#table {
    position: absolute;
    bottom: 0;
    width: 100%;
    max-height: 30%;
    overflow-y: auto;
    background: rgba(0,0,0,0.5);
    padding: 5px 0;
    font-size: 2.5vw;
    direction: ltr;
}

.row {
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="title">שם לפי שעה</div>
<div id="clock"></div>

<div id="names">
    <div id="name1" class="name"></div>
    <div id="name2" class="name"></div>
</div>

<div id="timeRange"></div>
<div id="table"></div>

<script>
const nightNames = [
"אדני אינד","אדינ אידנ","אניד אנדי","דניא ינדא",
"דנאי ינאד","דינא ידנא","נדאי ניאד","נדיא נידא",
"נאדי נאיד","דאינ יאדנ","דאני יאנד","דיאנ ידאנ"
];

const dayNames = [
"יהוה אהיה","יההו אההי","יוהה איהה","הוהי היהא",
"הויה היאה","ההוי ההיא","והיה יהאה","וההי יההא",
"ויהה יאהה","היהו האהי","היוה האיה","ההיו ההאי"
];

function formatHour(hour) {
    let h = hour % 12;
    if (h === 0) h = 12;
    return h + (hour < 12 ? " AM" : " PM");
}

function getName(hour) {
    if (hour >= 18 || hour < 6) {
        let index = (hour >= 18) ? hour - 18 : hour + 6;
        return nightNames[index % 12];
    } else {
        let index = hour - 6;
        return dayNames[index % 12];
    }
}

function updateClock() {
    const now = new Date();
    let h = now.getHours();
    let m = String(now.getMinutes()).padStart(2, '0');
    let s = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("clock").innerText =
        formatHour(h) + ":" + m + ":" + s;

    let name = getName(h);
    let parts = name.split(" ");

    document.getElementById("name1").innerText = parts[0] || "";
    document.getElementById("name2").innerText = parts[1] || "";

    let next = (h + 1) % 24;
    document.getElementById("timeRange").innerText =
        formatHour(h) + " - " + formatHour(next);

    updateTable();
}

function updateTable() {
    let html = "";

    for (let i = 0; i < 24; i++) {
        let next = (i + 1) % 24;
        let name = getName(i);

        html += `<div class="row">
            ${formatHour(i)} - ${formatHour(next)} : ${name}
        </div>`;
    }

    document.getElementById("table").innerHTML = html;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
