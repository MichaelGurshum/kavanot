<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>שם לפי שעה</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'David Libre', serif;
    background: black;
    color: white;
    text-align: center;
    overflow: hidden;
}

/* Background stars */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(white 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: 0.25;
    z-index: -1;
}

/* Title */
#title {
    font-size: 5vw;
    margin-top: 20px;
    text-shadow: 0 0 10px gold, 0 0 20px gold;
}

/* Clock */
#clock {
    font-size: 4vw;
    margin-top: 10px;
}

/* Name container */
#nameContainer {
    position: absolute;
    top: 30%;
    width: 100%;
    transform: translateY(-50%);
}

/* Main name */
.nameMain {
    font-size: 10vw;
    font-weight: bold;
    text-shadow:
        0 0 10px #fff,
        0 0 20px gold,
        0 0 40px gold;
}

/* Second name */
.nameSub {
    font-size: 6vw;
    margin-top: 15px;
    text-shadow:
        0 0 8px #fff,
        0 0 15px gold;
}

/* Time range */
#timeRange {
    position: absolute;
    bottom: 10%;
    width: 100%;
    font-size: 3vw;
}

/* Table */
#table {
    position: absolute;
    bottom: 0;
    width: 100%;
    max-height: 20%;
    overflow-y: auto;
    font-size: 2vw;
    direction: rtl;
}
</style>
</head>

<body>

<div id="title">שם לפי שעה</div>
<div id="clock"></div>

<div id="nameContainer">
    <div id="nameMain" class="nameMain"></div>
    <div id="nameSub" class="nameSub"></div>
</div>

<div id="timeRange"></div>
<div id="table"></div>

<script>
const nightNames = [
"אדני אינד","אדינ אידנ","אניד אנדי","דניא ינדא",
"דנאי ינאד","דינא ידנא","נדאי ניאד","נדיא נידא",
"נאדי נאיד","דאינ יאדנ","דאני יאנד","דיאנ ידאנ"
];

const dayNames = [
"יהוה אהיה","יההו אההי","יוהה איהה","הוהי היהא",
"הויה היאה","ההוי ההיא","והיה יהאה","וההי יההא",
"ויהה יאהה","היהו האהי","היוה האיה","ההיו ההאי"
];

function formatHour(hour) {
    let h = hour % 12;
    if (h === 0) h = 12;
    return h + (hour < 12 ? " AM" : " PM");
}

function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes().toString().padStart(2, '0');
    let seconds = now.getSeconds().toString().padStart(2, '0');

    document.getElementById("clock").innerText =
        formatHour(hours) + ":" + minutes + ":" + seconds;

    let index;
    let names;

    if (hours >= 18 || hours < 6) {
        // Night: 6PM–6AM
        index = (hours >= 18) ? hours - 18 : hours + 6;
        names = nightNames;
    } else {
        // Day: 6AM–6PM
        index = hours - 6;
        names = dayNames;
    }

    const current = names[index % 12];
    const parts = current.split(" ");

    document.getElementById("nameMain").innerText = parts[0];
    document.getElementById("nameSub").innerText = parts[1];

    // FIXED time range (correct direction)
    let startHour = hours;
    let endHour = (hours + 1) % 24;

    document.getElementById("timeRange").innerText =
        formatHour(startHour) + " - " + formatHour(endHour);

    updateTable(hours);
}

function updateTable(currentHour) {
    let html = "";

    for (let i = 0; i < 24; i++) {
        let index;
        let names;

        if (i >= 18 || i < 6) {
            index = (i >= 18) ? i - 18 : i + 6;
            names = nightNames;
        } else {
            index = i - 6;
            names = dayNames;
        }

        html += `
        <div>
            ${formatHour(i)} - ${formatHour((i + 1) % 24)}
            : ${names[index % 12]}
        </div>`;
    }

    document.getElementById("table").innerHTML = html;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
