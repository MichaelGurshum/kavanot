<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שם לפי שעה</title>

<!-- Scripture-like font -->
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* ---------- BACKGROUND ---------- */
body{
  margin:0;
  font-family:'Frank Ruhl Libre', serif;
  background-image:url("background.jpeg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  overflow:hidden;
  text-align:center;
  color:white;
  position:relative;
}

/* dark overlay to make background darker */
body::after{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4); /* increased darkness */
  pointer-events:none;
}

/* ---------- NAME ---------- */
#message{
  font-size:12vw;
  font-weight:900;
  letter-spacing:18px;
  margin-top:18vh;
  color:#fff9b0; /* brighter yellow-white for contrast */
  text-align:center;
  text-shadow:
    0 0 10px #fff9b0,
    0 0 20px #fff38a,
    0 0 40px #ffe45c,
    0 0 80px #ffd83b,
    0 0 120px #ffc800,
    0 0 160px #ffc800,
    0 0 200px #ffc800;
  filter:drop-shadow(0 0 30px #ffd83b);
  animation:holyGlow 3s ease-in-out infinite alternate;
  transition:opacity .4s;
}
@keyframes holyGlow{
  0%{
    text-shadow:
      0 0 10px #fff9b0,
      0 0 20px #fff38a,
      0 0 40px #ffe45c,
      0 0 80px #ffd83b,
      0 0 120px #ffc800,
      0 0 160px #ffc800,
      0 0 200px #ffc800;
  }
  100%{
    text-shadow:
      0 0 20px #fff9b0,
      0 0 40px #fff38a,
      0 0 80px #ffe45c,
      0 0 140px #ffd83b,
      0 0 200px #ffc800,
      0 0 240px #ffc800,
      0 0 280px #ffc800;
  }
}

/* ---------- CLOCK ---------- */
#clockContainer{
  position:absolute;
  bottom:40px;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.clock{
  width:170px;
  height:170px;
  border:6px solid white;
  border-radius:50%;
  position:relative;
  box-shadow:
    0 0 15px rgba(255,255,255,0.9),
    0 0 25px rgba(255,255,200,0.9);
}
/* center pin */
.clock::after{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  background:white;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 15px white;
}
/* hands */
.hand{
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:bottom center;
  transform:translateX(-50%) rotate(0deg);
  border-radius:3px;
}
.hour{ width:6px; height:45px; background:white; }
.minute{ width:4px; height:65px; background:white; }
.second{ width:2px; height:75px; background:#ffd700; }

/* digital clock */
#digitalClock{
  margin-top:15px;
  font-size:28px;
  text-shadow:
    0 0 10px white,
    0 0 20px #ffe680;
}
</style>
</head>
<body>

<div id="message"></div>

<div id="clockContainer">
  <div class="clock">
    <div class="hand hour" id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
  </div>
  <div id="digitalClock"></div>
</div>

<audio id="chime" src="chime.mp3" preload="auto"></audio>

<script>
/* ---------- NAMES ---------- */
const nightNames=["אדני","אדינ","אניד","דניא","דנאי","דינא","נדאי","נדיא","נאדי","דאינ","דאני","דיאנ"];
const dayNames=["יהוה","יההו","יוהה","הוהי","הויה","ההוי","והיה","וההי","ויהה","היהו","היוה","ההיו"];
let lastHour=-1;

/* ---------- GET NAME ---------- */
function getName(hour){
  if(hour>=18) return nightNames[hour-18];
  if(hour<6) return nightNames[hour+6];
  return dayNames[hour-6];
}

/* ---------- UPDATE NAME ---------- */
function updateName(){
  let hour=new Date().getHours();
  if(hour!==lastHour){
    lastHour=hour;
    let name=getName(hour);
    let message=document.getElementById("message");
    message.style.opacity=0;
    setTimeout(()=>{
      message.innerText=name;
      message.style.opacity=1;
    },300);
    document.getElementById("chime").play().catch(()=>{});
  }
}

/* ---------- CLOCK ---------- */
function updateClock(){
  const now=new Date();
  const sec=now.getSeconds();
  const min=now.getMinutes();
  const hr=now.getHours()%12;
  const secDeg=sec*6;
  const minDeg=min*6 + sec*0.1;
  const hrDeg=hr*30 + min*0.5;
  document.getElementById("secondHand").style.transform=`translateX(-50%) rotate(${secDeg}deg)`;
  document.getElementById("minuteHand").style.transform=`translateX(-50%) rotate(${minDeg}deg)`;
  document.getElementById("hourHand").style.transform=`translateX(-50%) rotate(${hrDeg}deg)`;
  document.getElementById("digitalClock").textContent=now.toLocaleTimeString();
}

/* ---------- LOOP ---------- */
function tick(){
  updateClock();
  updateName();
}

setInterval(tick,1000);
tick();
</script>

</body>
</html>
