<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שם לפי שעה - Sacred Scroll</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Same styling as before */
body { margin:0; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background: radial-gradient(circle at center, #0a0f2c 0%, #000 70%), url('https://i.imgur.com/yVhfhwK.png') center/cover no-repeat; font-family: 'Noto Serif Hebrew', Arial, sans-serif; color:white; overflow:hidden; padding:20px;}
h1 { font-weight:400; letter-spacing:4px; opacity:0.7; font-size:2.5rem; text-shadow:0 0 10px #fff; margin-bottom:40px;}
#message { font-family:'Noto Serif Hebrew', serif; font-size:5rem; letter-spacing:12px; text-align:center; opacity:0; transition:opacity 1s ease-in-out;}
.night { color:#8ad1ff; text-shadow:0 0 5px #8ad1ff,0 0 15px #8ad1ff,0 0 30px #5abfff,0 0 60px #4fa8ff,0 0 100px #3b82ff; animation:glowPulse 3s ease-in-out infinite alternate;}
.day { color:#ffd700; text-shadow:0 0 5px #ffd700,0 0 15px #ffd700,0 0 30px #ffcc00,0 0 60px #ffb800,0 0 100px #ffaa00; animation:glowPulse 3s ease-in-out infinite alternate;}
@keyframes glowPulse {from{text-shadow:0 0 5px currentColor,0 0 15px currentColor,0 0 30px currentColor,0 0 60px currentColor,0 0 100px currentColor;} to{text-shadow:0 0 10px currentColor,0 0 25px currentColor,0 0 50px currentColor,0 0 100px currentColor,0 0 200px currentColor;}}
#stars { position:absolute;width:100%;height:100%;top:0;left:0;background:transparent;pointer-events:none; z-index:-1;}
.star {position:absolute;background:white;border-radius:50%;opacity:0.8;animation:twinkle 2s infinite alternate;}
@keyframes twinkle{0%{opacity:0.2;transform:scale(0.5);}50%{opacity:1;transform:scale(1);}100%{opacity:0.2;transform:scale(0.5);}}
#hourTable { position:absolute;bottom:0;width:100%;background:rgba(0,0,0,0.2);overflow-x:auto;white-space:nowrap;padding:5px 0;font-size:0.8rem;text-align:center;color:rgba(255,255,255,0.6);}
#hourTable span{display:inline-block;padding:0 10px;}
</style>
</head>
<body>
<h1>שם לפי שעה</h1>
<div id="message"></div>
<div id="stars"></div>
<div id="hourTable"></div>

<script>
// --- Names ---
const nightNames=["אדני","אדינ","אניד","דניא","דנאי","דינא","נדאי","נדיא","נאדי","דאינ","דאני","דיאנ"];
const dayNames=["יהוה","יההו","יוהה","הוהי","הויה","ההוי","והיה","וההי","ויהה","היהו","היוה","ההיו"];

const messageEl=document.getElementById('message');
const hourTableEl=document.getElementById('hourTable');

function getNameByHour(hour){if(hour>=18||hour<6)return{ name: hour>=18?nightNames[hour-18]:nightNames[hour+6], type:'night'}; return{ name: dayNames[hour-6], type:'day'};}
function updateName(){const hour=new Date().getHours(); const {name,type}=getNameByHour(hour); messageEl.style.opacity=0; setTimeout(()=>{messageEl.innerText=name; messageEl.className=type; messageEl.style.opacity=1;},500);}
function generateHourTable(){hourTableEl.innerHTML=''; for(let h=0;h<24;h++){const{name}=getNameByHour(h); const span=document.createElement('span'); const hourStr=h.toString().padStart(2,'0')+":00"; span.innerText=`${hourStr} - ${name}`; hourTableEl.appendChild(span);}}

const starsEl=document.getElementById('stars');
for(let i=0;i<100;i++){const star=document.createElement('div'); star.className='star'; const size=Math.random()*3+1; star.style.width=star.style.height=`${size}px`; star.style.top=`${Math.random()*100}%`; star.style.left=`${Math.random()*100}%`; star.style.animationDuration=`${Math.random()*3+2}s`; starsEl.appendChild(star);}

// --- Notifications ---
function requestNotificationPermission(){if(!("Notification"in window)){console.log("This browser does not support notifications.");return;} if(Notification.permission==="default"){Notification.requestPermission().then(p=>{if(p==="granted") subscribeToPush();});}else if(Notification.permission==="granted"){subscribeToPush();}}

// Register service worker & subscribe
function subscribeToPush(){navigator.serviceWorker.ready.then(reg=>{console.log("Service Worker ready:", reg); /* Here you would call your server to subscribe for push */});}

updateName();
generateHourTable();
setInterval(updateName,60000);
requestNotificationPermission();

// --- Register Service Worker ---
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(reg=>console.log("Service Worker registered:", reg)).catch(err=>console.error("SW failed:",err));}
</script>
</body>
</html>
