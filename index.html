<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>שם לפי שעה</title>

<style>
body {
    margin: 0;
    font-family: 'Frank Ruhl Libre', serif;
    color: white;
    text-align: center;

    background: url("background.jpeg") no-repeat center center fixed;
    background-size: cover;
}

/* Overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
}

/* Main wrapper */
#content {
    position: relative;
    z-index: 1;
}

/* Title */
#title {
    font-size: 5vw;
    margin-top: 15px;
    text-shadow: 0 0 10px gold;
    letter-spacing: 2px;
}

/* Clock */
#clock {
    font-size: 4vw;
    margin-top: 5px;
}

/* Name (Premium Glow + Animation) */
#name {
    font-size: 8vw;
    margin-top: 10vh;
    font-weight: bold;

    text-shadow:
        0 0 10px #fff,
        0 0 20px gold,
        0 0 40px gold;

    transition: all 0.5s ease;
    animation: glowPulse 3s infinite alternate;
}

/* Glow animation */
@keyframes glowPulse {
    from {
        text-shadow:
            0 0 10px #fff,
            0 0 20px gold,
            0 0 30px gold;
    }
    to {
        text-shadow:
            0 0 20px #fff,
            0 0 40px gold,
            0 0 60px gold;
    }
}

/* Time Range */
#timeRange {
    margin-top: 10px;
    font-size: 3vw;
    direction: ltr;
}

/* Table */
#table {
    position: fixed;
    bottom: 0;
    width: 100%;
    max-height: 30%;
    overflow-y: auto;
    background: rgba(0,0,0,0.6);
    font-size: 2.5vw;
    direction: ltr;
}

/* Table rows */
.row {
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    transition: all 0.3s ease;
}

/* 🔥 ACTIVE HOUR HIGHLIGHT */
.active {
    background: rgba(255,215,0,0.2);
    color: gold;
    font-weight: bold;
    box-shadow: 0 0 10px gold;
}
</style>
</head>

<body>

<div id="content">

<div id="title">שם לפי שעה</div>
<div id="clock"></div>

<div id="name"></div>

<div id="timeRange"></div>
<div id="table"></div>

</div>

<script>
const nightNames = [
"אדני אינד","אדינ אידנ","אניד אנדי","דניא ינדא",
"דנאי ינאד","דינא ידנא","נדאי ניאד","נדיא נידא",
"נאדי נאיד","דאינ יאדנ","דאני יאנד","דיאנ ידאנ"
];

const dayNames = [
"יהוה אהיה","יההו אההי","יוהה איהה","הוהי היהא",
"הויה היאה","ההוי ההיא","והיה יהאה","וההי יההא",
"ויהה יאהה","היהו האהי","היוה האיה","ההיו ההאי"
];

/* Format Time */
function formatTime(hour, min, sec) {
    let h = hour % 12;
    if (h === 0) h = 12;

    let ampm = hour < 12 ? "AM" : "PM";

    return `${h}:${min}:${sec} ${ampm}`;
}

function formatHour(hour) {
    let h = hour % 12;
    if (h === 0) h = 12;
    return h + (hour < 12 ? " AM" : " PM");
}

/* Get Name */
function getName(hour) {
    if (hour >= 18 || hour < 6) {
        let index = (hour >= 18) ? hour - 18 : hour + 6;
        return nightNames[index % 12];
    } else {
        let index = hour - 6;
        return dayNames[index % 12];
    }
}

/* Update UI */
function updateClock() {
    const now = new Date();

    let h = now.getHours();
    let m = String(now.getMinutes()).padStart(2, '0');
    let s = String(now.getSeconds()).padStart(2, '0');

    document.getElementById("clock").innerText =
        formatTime(h, m, s);

    // ✨ Smooth name change
    const nameEl = document.getElementById("name");
    nameEl.style.opacity = 0;

    setTimeout(() => {
        nameEl.innerText = getName(h);
        nameEl.style.opacity = 1;
    }, 200);

    let next = (h + 1) % 24;
    document.getElementById("timeRange").innerText =
        formatHour(h) + " - " + formatHour(next);

    updateTable(h);
}

/* Table with active highlight */
function updateTable(currentHour) {
    let html = "";

    for (let i = 0; i < 24; i++) {
        let next = (i + 1) % 24;

        let activeClass = (i === currentHour) ? "row active" : "row";

        html += `<div class="${activeClass}">
            ${formatHour(i)} - ${formatHour(next)} : ${getName(i)}
        </div>`;
    }

    document.getElementById("table").innerHTML = html;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
