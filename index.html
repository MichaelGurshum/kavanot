<!DOCTYPE html>
<html lang="he">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>שם לפי שעה</title>

<style>

body{
margin:0;
font-family:Arial;
background-image:url("background.jpeg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
overflow:hidden;
text-align:center;
color:white;
}

/* NAME */

#message{

font-size:8vw;
margin-top:22vh;
letter-spacing:10px;

color:#fff9d6;

text-shadow:
0 0 10px #fff9b0,
0 0 25px #fff6a0,
0 0 40px #ffe96b,
0 0 70px #ffd84a,
0 0 100px #ffcc00;

animation:glowPulse 3s infinite alternate;

transition:opacity .4s;

}

/* TITLE */

#title{

font-size:3vw;
margin-top:10px;

text-shadow:
0 0 6px #fff8c0,
0 0 12px #ffe680;

}

/* GLOW */

@keyframes glowPulse{

from{

text-shadow:
0 0 10px #fff9b0,
0 0 25px #fff6a0,
0 0 40px #ffe96b,
0 0 70px #ffd84a,
0 0 100px #ffcc00;

}

to{

text-shadow:
0 0 20px #fff9b0,
0 0 40px #fff6a0,
0 0 70px #ffe96b,
0 0 100px #ffd84a,
0 0 140px #ffcc00;

}

}

/* CLOCK */

#clockContainer{

position:absolute;
bottom:40px;
width:100%;
display:flex;
flex-direction:column;
align-items:center;

}

.clock{

width:160px;
height:160px;
border:6px solid white;
border-radius:50%;
position:relative;

box-shadow:
0 0 10px rgba(255,255,255,.8),
0 0 20px rgba(255,255,200,.8);

}

.hand{

position:absolute;
background:white;
top:50%;
left:50%;
transform-origin:bottom;
transform:translateX(-50%);

}

.hour{width:6px;height:40px;}
.minute{width:4px;height:60px;}
.second{width:2px;height:70px;background:#ffd700;}

#digitalClock{

margin-top:15px;
font-size:28px;

text-shadow:
0 0 6px white,
0 0 10px #ffe680;

}

</style>
</head>

<body>

<div id="message"></div>
<div id="title"></div>

<div id="clockContainer">

<div class="clock">

<div class="hand hour" id="hourHand"></div>
<div class="hand minute" id="minuteHand"></div>
<div class="hand second" id="secondHand"></div>

</div>

<div id="digitalClock"></div>

</div>

<audio id="chime" src="chime.mp3" preload="auto"></audio>

<script>

/* NAMES */

const nightNames=[
"אדני","אדינ","אניד","דניא","דנאי","דינא",
"נדאי","נדיא","נאדי","דאינ","דאני","דיאנ"
];

const dayNames=[
"יהוה","יההו","יוהה","הוהי","הויה","ההוי",
"והיה","וההי","ויהה","היהו","היוה","ההיו"
];

let lastHour=-1;

/* NAME BY HOUR */

function getName(hour){

if(hour>=18){

return nightNames[hour-18];

}

if(hour<6){

return nightNames[hour+6];

}

return dayNames[hour-6];

}

/* UPDATE NAME */

function updateName(){

let hour=new Date().getHours();

if(hour!==lastHour){

lastHour=hour;

let name=getName(hour);

let message=document.getElementById("message");

message.style.opacity=0;

setTimeout(()=>{

message.innerText=name;
message.style.opacity=1;

},300);

document.getElementById("chime").play().catch(()=>{});

}

}

/* CLOCK */

function updateClock(){

const now=new Date();

const sec=now.getSeconds();
const min=now.getMinutes();
const hr=now.getHours()%12;

const secDeg=sec*6;
const minDeg=min*6 + sec*0.1;
const hrDeg=hr*30 + min*0.5;

document.getElementById("secondHand").style.transform=`translateX(-50%) rotate(${secDeg}deg)`;
document.getElementById("minuteHand").style.transform=`translateX(-50%) rotate(${minDeg}deg)`;
document.getElementById("hourHand").style.transform=`translateX(-50%) rotate(${hrDeg}deg)`;

document.getElementById("digitalClock").textContent=now.toLocaleTimeString();

}

/* LOOP */

function tick(){

updateClock();
updateName();

}

setInterval(tick,1000);

tick();

</script>

</body>
</html>
