<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שם לפי שעה</title>

<style>
body {
    margin: 0;
    font-family: 'Frank Ruhl Libre', serif;
    text-align: center;
    background: url("background.jpeg") no-repeat center center fixed;
    background-size: cover;
    color: white;
}

/* Dark overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
}

#content {
    position: relative;
    z-index: 1;
}

#title {
    font-size: 5vw;
    margin-top: 20px;
    text-shadow: 0 0 10px gold;
}

#clock {
    margin-top: 10px;
}

#name {
    font-size: 9vw;
    margin-top: 12vh;
    font-weight: bold;
    direction: rtl;
}

/* Each word stacked */
.name-line {
    display: block;
    margin: 10px 0;
}

/* Strong steady glow */
.fire-layer {
    display: inline-block;
    position: relative;
    margin: 0 1px;
}

.fire-layer .base {
    color: #FFD700;
    font-weight: bold;
    text-shadow:
        0 0 4px #fff,
        0 0 8px #FFD700,
        0 0 12px orange,
        0 0 18px gold,
        0 0 25px orange;
}

.fire-layer .glow {
    position: absolute;
    top: 0;
    left: 0;
    color: orange;
    opacity: 0.4;
    text-shadow:
        0 0 10px orange,
        0 0 20px gold,
        0 0 30px orange;
}

.fire-layer .spark {
    position: absolute;
    top: 0;
    left: 0;
    color: red;
    opacity: 0.25;
}

#timeRange {
    margin-top: 10px;
    font-size: 3vw;
    direction: ltr;
}

#bottomStrip {
    position: fixed;
    bottom: 0;
    width: 100%;
    overflow-x: auto;
    white-space: nowrap;
    background: rgba(0,0,0,0.5);
    padding: 6px 0;
}

.hourItem {
    display: inline-block;
    margin: 0 8px;
    font-size: 2.8vw;
    opacity: 0.7;
}

.active {
    color: gold;
    font-weight: bold;
    opacity: 1;
    text-shadow: 0 0 10px gold;
}
</style>
</head>

<body>

<div id="content">
    <div id="title">שם לפי שעה</div>
    <div id="clock"></div>
    <div id="name"></div>
    <div id="timeRange"></div>
</div>

<div id="bottomStrip"></div>

<script>

/* ✅ CORRECT mapping (midnight = index 0) */
const hourNames = [
  "נדאי ניאד",
  "נדיא נידא",
  "נאדי נאיד",
  "דאינ יאדנ",
  "דאני יאנד",
  "דיאנ ידאנ",
  "יהוה אהיה",
  "יההו אההי",
  "יוהה איהה",
  "הוהי היהא",
  "הויה היאה",
  "ההוי ההיא",
  "והיה יהאה",
  "וההי יההא",
  "ויהה יאהה",
  "היהו האהי",
  "היוה האיה",
  "ההיו ההאי",
  "אדני אינד",
  "אדינ אידנ",
  "אניד אנדי",
  "דניא ינדא",
  "דנאי ינאד",
  "דינא ידנא"
];

/* Bottom strip formatting */
function addDashes(name) {
    return name.split(" ").map(word => word.split("").join("-")).join(" ");
}

/* Stacked glowing name */
function addFireGlow(name){
    const words = name.split(" ");

    return words.map(word=>{
        return `<div class="name-line">` +
            word.split("").map((letter,i)=>{
                let dash = (i<word.length-1) ? "-" : "";
                return `<span class="fire-layer">
                            <span class="base">${letter}</span>
                            <span class="glow">${letter}</span>
                            <span class="spark">${letter}</span>
                        </span>${dash}`;
            }).join("") +
        `</div>`;
    }).join("");
}

/* Time formatting */
function formatTime(hour, min, sec) {
    let h = hour % 12; if(h==0) h=12;
    let ampm = hour<12 ? "AM":"PM";
    return `${h}:${min}:${sec} ${ampm}`;
}

function formatHour(hour){
    let h = hour % 12; if(h==0) h=12;
    return h + (hour<12 ? " AM":" PM");
}

function getName(hour){
    return hourNames[hour];
}

/* Bottom strip */
function buildStrip(currentHour){
    let html="";
    for(let i=0;i<24;i++){
        let cls=(i===currentHour)?"hourItem active":"hourItem";
        html+=`<span class="${cls}">${formatHour(i)} ${addDashes(getName(i))}</span>`;
    }
    document.getElementById("bottomStrip").innerHTML=html;
}

/* MAIN CLOCK UPDATE */
function updateClock(){

    // ✅ FORCE New York timezone (VERY IMPORTANT)
    const now = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));

    let h = now.getHours();
    let m = String(now.getMinutes()).padStart(2,'0');
    let s = String(now.getSeconds()).padStart(2,'0');

    const nameEl = document.getElementById("name");
    const clockEl = document.getElementById("clock");

    // Match clock size to name
    const nameSize = window.getComputedStyle(nameEl).fontSize;
    clockEl.style.fontSize = nameSize;

    clockEl.innerText = formatTime(h,m,s);

    // Show correct name
    nameEl.innerHTML = addFireGlow(getName(h));

    let next = (h+1)%24;
    document.getElementById("timeRange").innerText =
        formatHour(h) + " - " + formatHour(next);

    buildStrip(h);
}

setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
