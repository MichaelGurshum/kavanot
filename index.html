<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שם לפי שעה</title>

<!-- Scripture-like font -->
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  font-family:'Frank Ruhl Libre', serif;
  overflow:hidden;
  background:#000;
}

#background {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background: url("background.jpeg") center center / cover no-repeat;
  z-index:0;
}

#overlay {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background-color: rgba(0,0,0,0.7);
  z-index:1;
}

#content {
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  height:100%;
  align-items:center;
  padding:20px 10px;
  box-sizing:border-box;
}

/* ---------- TITLE ---------- */
#title {
  font-size:2rem;
  font-weight:bold;
  color:#fff9b0;
  text-shadow:0 0 6px #ffd83b;
  text-align:center;
  margin-top:10px;
}

/* ---------- MAIN NAME ---------- */
#message {
  font-size:10vw;
  font-weight:900;
  letter-spacing:12px;
  color:#fff9b0;
  text-align:center;
  word-break:break-word;
  text-shadow:
    0 0 10px #fff9b0,
    0 0 20px #fff38a,
    0 0 40px #ffe45c,
    0 0 80px #ffd83b,
    0 0 120px #ffc800;
  filter: drop-shadow(0 0 30px #ffd83b);
  animation:holyGlow 3s ease-in-out infinite alternate;
  margin-top:5vh;
}
@keyframes holyGlow{
  0%{ text-shadow:0 0 10px #fff9b0,0 0 20px #fff38a,0 0 40px #ffe45c,0 0 80px #ffd83b,0 0 120px #ffc800;}
  100%{ text-shadow:0 0 20px #fff9b0,0 0 40px #fff38a,0 0 80px #ffe45c,0 0 140px #ffd83b,0 0 200px #ffc800;}
}

/* ---------- DIGITAL CLOCK ---------- */
#clockContainer {
  font-size:28px;
  text-shadow:0 0 10px white,0 0 20px #ffe680;
  margin-top:10px;
  text-align:center;
}

/* ---------- BOTTOM NAME LIST ---------- */
#nameList {
  width:90%;
  text-align:center;
  font-size:1rem;
  color:#fff;
  text-shadow:0 0 4px #ffd83b;
  margin-bottom:10px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
}
.hourName {
  padding:2px 6px;
  border-radius:4px;
  background-color: rgba(255,255,255,0.1);
}
.currentHour {
  background-color: rgba(255,255,255,0.5);
  font-weight:bold;
}

/* ---------- BUTTON ---------- */
button {
  font-size:16px;
  padding:8px 16px;
  margin:10px;
  border:none;
  border-radius:6px;
  background-color: rgba(255,255,255,0.2);
  color:#fff;
  text-shadow:0 0 6px #fff;
  cursor:pointer;
}
button:hover { background-color: rgba(255,255,255,0.4);}
</style>
</head>
<body>

<div id="background"></div>
<div id="overlay"></div>

<div id="content">
  <div id="title">שם לפי שעה</div>
  <div id="message"></div>

  <div id="clockContainer">
    <div id="digitalClock"></div>
  </div>

  <div id="nameList"></div>

  <audio id="chime" src="chime.mp3" preload="auto"></audio>
</div>

<script>
const nightNames=["אדני","אדינ","אניד","דניא","דנאי","דינא","נדאי","נדיא","נאדי","דאינ","דאני","דיאנ"];
const dayNames=["יהוה","יההו","יוהה","הוהי","הויה","ההוי","והיה","וההי","ויהה","היהו","היוה","ההיו"];
let lastHour=-1;

// populate bottom name list
function populateNameList(){
  let container=document.getElementById("nameList");
  container.innerHTML="";
  for(let i=0;i<24;i++){
    let span=document.createElement("span");
    span.className="hourName";
    let name;
    if(i>=18||i<6){
      name=nightNames[(i+6)%12];
    } else {
      name=dayNames[i-6];
    }
    span.textContent=`${i}:00 ${name}`;
    span.id=`hour${i}`;
    container.appendChild(span);
  }
}

// get current hour name
function getName(hour){
  if(hour>=18) return nightNames[hour-18];
  if(hour<6) return nightNames[hour+6];
  return dayNames[hour-6];
}

// format hour in 24->12
function formatHour(hour){
  let h=hour%12;
  if(h===0) h=12;
  let ampm=hour<12?'AM':'PM';
  return `${h} ${ampm}`;
}

// update main name and highlight bottom list and title
function updateName(){
  let hour=new Date().getHours();
  if(hour!==lastHour){
    lastHour=hour;
    let name=getName(hour);
    let message=document.getElementById("message");
    message.style.opacity=0;
    setTimeout(()=>{
      message.innerText=name;
      message.style.opacity=1;
    },200);

    // highlight bottom list
    document.querySelectorAll(".hourName").forEach(el=>el.classList.remove("currentHour"));
    let current=document.getElementById(`hour${hour}`);
    if(current) current.classList.add("currentHour");

    // update title with current hour range
    let nextHour=(hour+1)%24;
    document.getElementById("title").textContent=`שם לפי שעה: ${formatHour(hour)} – ${formatHour(nextHour)}`;

    document.getElementById("chime").play().catch(()=>{});
  }
}

// digital clock
function updateClock(){
  const now=new Date();
  document.getElementById("digitalClock").textContent = now.toLocaleTimeString();
}

// loop
function tick(){
  updateClock();
  updateName();
}

populateNameList();
setInterval(tick,1000);
tick();
</script>

</body>
</html>
